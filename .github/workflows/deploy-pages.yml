name: Deploy website and source-built PDF to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Chinese fonts and PDF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python3 -m pip install --disable-pip-version-check 'markdown==3.9' 'weasyprint==68.0' 'fonttools==4.63.0' 'pydyf==0.12.1' 'pymupdf==1.26.7' 'pillow==11.3.0'
      - name: Generate PDF from canonical Markdown sources
        run: python3 scripts/build_pdf.py
      - name: Verify repeatable PDF bytes from unchanged Markdown
        run: |
          expected=$(sha256sum pdf/chatgpt-income-handbook-guide.pdf | cut -d' ' -f1)
          python3 scripts/build_pdf.py
          actual=$(sha256sum pdf/chatgpt-income-handbook-guide.pdf | cut -d' ' -f1)
          test "$expected" = "$actual"
          echo "Reproducible source → PDF SHA-256: $actual"
      - name: Render and inspect every PDF page automatically
        run: python3 scripts/pdf_quality_gate.py
      - name: Python content and local-link tests
        run: python3 -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check data/catalog.js
          node --check lib/economics.js
      - name: Test negative financial scenarios
        run: node tests/test_economics.cjs
      - name: Retain published PDF and manifest for deployment
        uses: actions/upload-artifact@v4
        with:
          name: handbook-pdf-build
          path: pdf/
          if-no-files-found: error
          retention-days: 14
      - name: Retain visual proof for ALL pages
        uses: actions/upload-artifact@v4
        with:
          name: pdf-page-render-qa
          path: pdf-qa-output/
          if-no-files-found: error
          retention-days: 30
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download verified PDF, never re-render untested bytes
        uses: actions/download-artifact@v4
        with:
          name: handbook-pdf-build
          path: pdf/
      - name: Archive verified PDF and manifest (non-force push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/chatgpt-income-handbook-guide.pdf pdf/edition.json
          if git diff --cached --quiet; then
            echo "PDF edition unchanged"
          else
            git commit -m "docs(pdf): publish generated ChatGPT handbook edition [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy website with PDF
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify LIVE website and PDF exact hash
        shell: bash
        run: |
          set -euo pipefail
          base="https://aipmandy.github.io/chatgpt-income-handbook/"
          expected=$(python3 -c 'import json;print(json.load(open("pdf/edition.json"))["sha256"])')
          for resource in index.html handbook.html workbench.html robots.txt sitemap.xml; do
            curl -fLsS --retry 6 --retry-delay 8 --retry-all-errors "${base}${resource}" -o /tmp/checked-site-resource
            test -s /tmp/checked-site-resource
            echo "LIVE HTTP 200: ${resource}"
          done
          pdf_url="${base}pdf/chatgpt-income-handbook-guide.pdf"
          for attempt in 1 2 3 4 5 6; do
            curl -fLsS --retry 3 --retry-delay 5 "${pdf_url}" -o /tmp/live-handbook.pdf
            actual=$(sha256sum /tmp/live-handbook.pdf | cut -d' ' -f1)
            if [ "${actual}" = "${expected}" ]; then
              echo "LIVE PDF SHA-256 verified: ${actual}"
              exit 0
            fi
            echo "LIVE PDF mismatch on attempt ${attempt}: ${actual}; expected ${expected}"
            sleep 12
          done
          exit 1
